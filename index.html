<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V Fitness">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>V Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
</head>
<body style="background:#000">
<style>
/* Layout: dunkle App-Shell. Sticky Kopfzeile, ein Tab-Inhalt, schwebende Navigationsleiste mit Start-Button. Neon nur für Fortschritt und Aktionen. Bewusst nur dunkles Theme. */
:root{
  color-scheme:dark;
  --bg:#000; --surface:#0b0c0f; --surface-2:#16191e; --surface-3:#1e2228; --line:rgba(255,255,255,.07);
  --fg:#f1f3ef; --muted:#8a919b; --dim:#5a616b;
  --neon:#36d6ff;--neon-rgb:54,214,255;--neon-l:#9eefff; --neon-2:#0fa8d4; --neon-soft:rgba(var(--neon-rgb),.12); --on-neon:#021117;
  --amber:#ffb84a; --amber-soft:rgba(255,184,74,.13); --red:#ff6359; --blue:#6f95ff; --teal:#3fe0c5; --violet:#a98bff;
  --sa:#ff6a5b; --sb:#6f95ff; --sc:#ffc53d;--sd:#7ee0a0;--se:#d58bff;--sf:#ff8ac2;
  --display:"Sora","Geist",system-ui,sans-serif;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:10px}
input{font:inherit;color:var(--fg)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.02em;text-wrap:balance}
.muted{color:var(--muted)}.small{font-size:.82rem}
.neon{color:var(--neon)}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.appbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand span:nth-child(2){white-space:nowrap}
@media (max-width:400px){.brand span:nth-child(2){display:none}.wk{min-width:72px}}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:1.02rem}
.logo{width:34px;height:34px;border-radius:11px;background:#000;border:1px solid rgba(var(--neon-rgb),.3);display:grid;place-items:center;padding:1px;}
.sync{width:6px;height:6px;border-radius:50%;background:var(--neon);opacity:.8}
.sync.busy{background:var(--amber)}.sync.err{background:var(--red)}
.bar-r{display:flex;align-items:center;gap:6px}
.weeknav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.weeknav button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.weeknav button:hover{background:var(--surface-2);color:var(--fg)}
.wk{display:flex;flex-direction:column;align-items:center;padding:0 4px;min-width:84px;line-height:1.15}
.wk b{font-size:.82rem}.wk small{font-size:.66rem;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.icon-btn:hover,.icon-btn.on{color:var(--neon)}

/* Main */
main{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:1.02rem;font-weight:600}
.sec-h span{font-size:.78rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;}
.pad{padding:16px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:14px;font-weight:600;font-size:.9rem;background:var(--surface-2);border:1px solid var(--line)}
.btn:hover{background:var(--surface-3)}
.btn.neon-btn{background:var(--neon);color:var(--on-neon);border-color:transparent;}
.btn.neon-btn:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}

/* Heute */
.banner{display:grid;grid-template-columns:44% minmax(0,1fr);align-items:center;background:#000;overflow:hidden}
.banner img{display:block;width:100%;height:auto}
.banner .txt{padding:16px 16px 16px 6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.banner small{color:var(--muted);font-size:.84rem}
.banner h1{font-size:clamp(1.6rem,7.5vw,2rem);font-weight:700;line-height:1.05}
.banner p{margin:4px 0 0;color:#aeb6bf;font-size:.84rem;line-height:1.4}
.lvl.av{grid-template-columns:auto minmax(0,1fr) auto}
.lvl.av .xpbar{grid-column:2 / -1}
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.hello small{color:var(--muted);font-size:.86rem}
.hello h1{font-size:clamp(1.5rem,7vw,1.9rem);font-weight:700;line-height:1.1}
.avatar{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.avatar span{font-size:.66rem;font-weight:600;color:var(--neon);font-family:var(--mono)}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:14px 16px}
.lvl b{font-family:var(--display);font-weight:600}
.lvl small{color:var(--muted);font-size:.78rem}
.xpbar{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--neon);border-radius:4px;}
.streak{padding:16px;display:flex;flex-direction:column;gap:14px}
.streak-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flame{display:flex;align-items:center;gap:10px}
.flame svg{}
.flame b{font-family:var(--display);font-size:1.3rem}
.flame small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.wdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.7rem;color:var(--muted)}
.wdot i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:transparent}
.wdot.on i{background:var(--neon);color:var(--on-neon);}
.wdot.today i{background:none;border:2px solid var(--neon)}
.wdot.today.on i{background:var(--neon)}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;padding:18px;background:#000}
.hero h2{font-size:clamp(1.2rem,5.4vw,1.5rem);font-weight:700;line-height:1.1;margin:6px 0 6px}
.hero p{margin:0 0 14px;color:var(--muted);font-size:.86rem}
.hero .fig{align-self:center;justify-self:center}
.metric{padding:16px;display:flex;flex-direction:column;gap:12px}
.metric+.metric{border-top:1px solid var(--line)}
.prot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.big{font-family:var(--display);font-size:1.7rem;font-weight:700;letter-spacing:-.03em}
.big small{font-family:var(--font);font-size:.82rem;color:var(--muted);font-weight:500;margin-left:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick button{padding:7px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--mono);font-size:.82rem;font-weight:500}
.quick button:hover{border-color:var(--neon);color:var(--neon)}
.foods{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.foods::-webkit-scrollbar{display:none}
.food{flex:none;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:left;min-width:118px}
.food b{font-size:.84rem;font-weight:500}
.food span{font-family:var(--mono);font-size:.78rem;color:var(--neon)}
.food:hover{border-color:rgba(var(--neon-rgb),.4)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0}
.duo .metric+.metric{border-top:0;border-left:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar i.hit{background:var(--neon);}
.field{width:64px;padding:8px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-family:var(--mono);font-size:.88rem;text-align:center}
.field::placeholder{color:var(--dim);opacity:1}
.field:focus{border-color:var(--neon);outline:none;background:var(--surface-3)}
.field.wide{width:100%;text-align:left;font-family:var(--font)}
.field.mid{width:100%}
.coach{display:flex;flex-direction:column}
.tip{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 16px;align-items:start}
.tip+.tip{border-top:1px solid var(--line)}
.tip .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--neon-soft);color:var(--neon)}
.tip .ic.warn{background:var(--amber-soft);color:var(--amber)}
.tip b{font-weight:600;font-size:.92rem}
.tip p{margin:2px 0 0;color:var(--muted);font-size:.85rem}

/* Ring */
.ring{position:relative;display:grid;place-items:center}
.ring svg{display:block}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .val b{font-family:var(--display);font-weight:700}
.ring .val small{font-size:.66rem;color:var(--muted)}
.rfill{transition:stroke-dashoffset .5s}

/* Training */
.sess{overflow:hidden}
.sess-head{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;text-align:left}
.badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.sess-title{display:flex;flex-direction:column;min-width:0}
.sess-title b{font-weight:600}
.sess-title small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.prog.full{color:var(--neon)}
.chev{transition:transform .2s;color:var(--muted)}
.sess.open .chev{transform:rotate(180deg)}
.sess-body{border-top:1px solid var(--line);padding:6px 8px 14px}
.slots{list-style:none;margin:0;padding:0}
.slot{display:grid;grid-template-columns:30px 26px minmax(0,1fr);gap:6px 10px;align-items:center;padding:12px 8px}
.slot+.slot{border-top:1px solid var(--line)}
.slot-in{grid-column:3;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem}
@media (min-width:560px){.slot{grid-template-columns:30px 26px minmax(0,1fr) auto}.slot-in{grid-column:auto}}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent;transition:all .15s}
.chk:hover{border-color:var(--muted)}
.done .chk,.chk.on{background:var(--neon);border-color:var(--neon);color:var(--on-neon);}
.plus{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--neon-soft);color:var(--neon);font-weight:700;font-family:var(--mono);font-size:.82rem}
.slot-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.ex-pick{display:inline-flex;align-items:center;gap:6px;max-width:100%;text-align:left;font-weight:500;border-radius:8px;padding:2px 6px;margin:-2px -6px}
.ex-pick:hover{background:var(--surface-2)}
.ex-pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-pick svg{flex:none;color:var(--muted)}
.done .ex-pick span{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.75rem;color:var(--muted)}
.mchip{font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:.64rem}
.swapped{color:var(--blue)}
.sugg{color:var(--neon)}
.pr{color:var(--neon);font-weight:600}
.rm{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.rm:hover{background:var(--surface-2);color:var(--red)}
.warm{display:flex;align-items:center;gap:10px;padding:10px 8px;font-size:.88rem}
.warm span{color:var(--muted)}
.actions{display:flex;gap:8px;padding:12px 8px 0;flex-wrap:wrap}
.actions.two{display:grid;grid-template-columns:1fr 1fr}
.actions.two .btn{padding:10px 8px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 16px}
.row+.row{border-top:1px solid var(--line)}
.row b{font-weight:500}
.row small{display:block;color:var(--muted);font-size:.77rem}
.run-in{grid-column:2 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.pace{font-family:var(--mono);color:var(--fg)}
.dots4{display:flex;gap:6px}
.dots4 button{width:26px;height:26px;border-radius:9px;background:var(--surface-3)}
.dots4 button.on{background:var(--neon);}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:.84rem;background:var(--surface-2)}
.chip.on{background:var(--neon-soft);border-color:rgba(var(--neon-rgb),.5);color:var(--neon);font-weight:500}

/* Körper */
.bodywrap{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 12px 10px;overflow:hidden;background:#000}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;font-size:.82rem;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface-3);color:var(--fg)}
.legend{display:flex;gap:14px;font-size:.74rem;color:var(--muted);padding:6px 0 4px;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.zones{mix-blend-mode:screen}
.zh{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:4}.zh.focus{stroke:rgba(var(--neon-rgb),.45);stroke-dasharray:10 9;stroke-width:3}.zh.sel{stroke:#e9fbff;stroke-width:5;fill:rgba(255,255,255,.07)}.zh.off{pointer-events:none}
.zn.ok{fill:url(#vf-gc)}.zn.part{fill:url(#vf-ga)}.zn.focus{fill:url(#vf-gf)}.zn.sel{fill:url(#vf-gs)}.zn.off{pointer-events:none}
.fig{display:block;max-width:100%;height:auto}
.mu{transition:fill .3s;cursor:pointer;stroke:rgba(0,0,0,.35);stroke-width:.6}
.mu.none{fill:#252a31}
.mu.focus{stroke:rgba(var(--neon-rgb),.45);stroke-width:1;stroke-dasharray:2 2}
.mu.part{fill:url(#vf-amber);filter:url(#vf-glow-s)}
.mu.ok,.mu.hl{fill:url(#vf-neon);filter:url(#vf-glow)}
.mu.neutral{fill:#1f2328;cursor:default}
.mu.sel{stroke:#fff;stroke-width:1.4;stroke-dasharray:none}
.minfo{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;margin-top:6px;background:var(--surface-2);border-radius:16px;border:1px solid var(--line)}
.minfo b{font-family:var(--display);font-weight:600}
.minfo small{grid-column:1 / -1;color:var(--muted);font-size:.8rem}
.mg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mg{padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;text-align:left}
.mg-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mg-top b{font-weight:600;font-size:.88rem}
.fokus{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--neon)}
.mdots{display:flex;gap:4px}
.mdots i{flex:1;height:6px;border-radius:3px;background:var(--surface-3)}
.mg.part .mdots i.on{background:var(--neon);opacity:.7}
.mg.ok .mdots i.on{background:var(--neon);}
.mg small{font-size:.72rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.tile small{font-size:.7rem;color:var(--muted)}
.tile b{font-family:var(--display);font-size:1.08rem;font-weight:600}
.weak{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:6px 12px;align-items:center;padding:10px 16px}
.weak b{font-weight:500;font-size:.9rem}
.weak small{grid-column:1 / -1;color:var(--muted);font-size:.78rem;margin-top:-2px}
.impact{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.impact i{display:block;height:100%;background:var(--amber);border-radius:3px}
.strong{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 14px}
.strong span{padding:6px 10px;border-radius:999px;background:var(--neon-soft);color:var(--neon);font-size:.8rem}
.find{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;padding:12px 16px}
.find+.find{border-top:1px solid var(--line)}
.find .d{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.find .d.ok{background:var(--neon);}.find .d.warn{background:var(--amber)}.find .d.bad{background:var(--red)}
.find b{font-weight:600;font-size:.9rem}
.find p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.inline .field{width:100px}

/* Erfolge */
.levelcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:18px}
.levelcard h2{font-size:1.4rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:center}
.bdg .hex{width:46px;height:46px;display:grid;place-items:center;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--surface-3);color:var(--dim)}
.bdg.on .hex{background:var(--neon);color:var(--on-neon);}
.bdg b{font-size:.78rem;font-weight:600}
.bdg small{font-size:.66rem;color:var(--muted);line-height:1.3}
.bdg:not(.on) b{color:var(--muted)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px}
.lift+.lift{border-top:1px solid var(--line)}
.lift b{font-weight:500}
.lift small{color:var(--muted);font-size:.77rem}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}

/* Live */

const LEGNAME={"Fliegende Kabel/Maschine":"kabel_fly","Schulterdrücken KH/Maschine":"sdr_kh","Klimmzüge":"klimmzug","Einarmiger Kabelzug":"lat_einarm","Kabelrudern":"kabelrudern","Langhantelrudern":"lh_rudern","Seitheben Maschine":"seit_m","Reverse Butterfly":"reverse_fly","Hammer Curls":"hammer","Trizepsdrücken Kabel":"pushdown","Overhead Trizeps Kabel":"overhead","Ausfallschritte":"bulgarian","Beinstrecker":"beinstrecker","Beinbeuger einbeinig":"bb_sitzend","Wadenheben Beinpresse":"waden_bp","Ab Wheel / Plank":"abwheel","Hyperextensions":"hyper","Dips":"dips","Butterfly / Pec Deck":"butterfly","Brustpresse Maschine":"brustpresse","Fliegende Kabel":"kabel_fly","Schrägbank Langhantel":"schraeg_lh"};
function legacyEx(e){if(LEGNAME[e.name])return LEGNAME[e.name];const hit=Object.keys(EX).find(k=>EX[k][0]===e.name);if(hit)return hit;const g=(e.mus||[])[0];return Object.keys(EX).find(k=>EX[k][1][0]===g)||"bank"}
function normalize(d){
  if(d&&d.v===2){const b=blank();const o={...b,...d,s:{},run:{...b.run,...(d.run||{})},bonus:{...(d.bonus||{})},days:JSON.parse(JSON.stringify(d.days||{})),act:{...(d.act||{})},cd:{...(d.cd||{})}};
    PLAN.forEach(p=>{const s=(d.s||{})[p.id]||{};o.s[p.id]={w:!!s.w,sl:JSON.parse(JSON.stringify(s.sl||{})),x:JSON.parse(JSON.stringify(s.x||[]))};if(Number.isInteger(s.day))o.s[p.id].day=s.day;if(Array.isArray(s.order))o.s[p.id].order=s.order.slice()});return o}
  const o=blank(); if(!d)return o;
  const ch=d.checks||{}, lg=d.logs||{};
  PLAN.forEach(p=>{const L=LEG[p.id];if(!L)return;o.s[p.id].w=!!ch[L.w];L.s.forEach((id,i)=>{if(!id)return;const l=lg[id]||{};if(ch[id]||l.reps!=null)o.s[p.id].sl[i]={d:true,kg:l.kg??null,reps:l.reps??null}})});
  (d.extras||[]).forEach(e=>{if(o.s[e.sid])o.s[e.sid].x.push({ex:legacyEx(e),kg:e.kg??null,reps:e.reps??null})});
  o.kurs=!!ch.c1;o.kampf=!!ch.k1;o.run={done:!!ch.r1||!!(d.run?.km&&d.run?.min),km:d.run?.km??null,min:d.run?.min??null};
  o.desk=["m1","m2","m3","m4"].filter(k=>ch[k]).length;
  o.bonus={sauna:!!ch.x1,swim:!!ch.x2,alc:!!ch.h1,fish:!!ch.h2,meat:!!ch.h3,light:!!ch.h4,special:!!ch.s1};
  o.special=d.special||"";o.days=JSON.parse(JSON.stringify(d.days||{}));o.weight=d.weight??null;if(d.note)o.note=d.note;
  return o;
}
const planOf=sid=>PLAN.find(x=>x.id===sid);
const ordOf=(d,sid)=>{const n=planOf(sid).slots.length,o=d.s[sid].order;return Array.isArray(o)&&o.length===n&&new Set(o).size===n?o.slice():[...Array(n).keys()]};
const cardioOn=(d,k)=>k==="run"?!!d.run?.done:(k==="kurs"||k==="kampf")?!!d[k]:!!(d.ax||{})[k];
function cardioSet(d,k,v){if(k==="run")d.run.done=v;else if(k==="kurs"||k==="kampf")d[k]=v;else{d.ax=d.ax||{};if(v)d.ax[k]=true;else delete d.ax[k]}}
function dayItems(d,i){const it=[];PLAN.forEach(p=>{if(d.s[p.id].day===i)it.push({k:p.id,type:"gym",p})});CARDIO.forEach(([k,n])=>{if((d.cd||{})[k]===i&&cardioOn(d,k))it.push({k,type:"cardio",n})});return it}
function dayActive(d,i){return dayItems(d,i).some(x=>x.type==="cardio"||sessProg(d,x.p).n>0)}
function slotEx(d,sid,i){return d.s[sid].sl[i]?.ex||planOf(sid).slots[i][0]}
function progress(d){let t=0,n=0;PLAN.forEach(p=>{const s=d.s[p.id];t+=1+p.slots.length;if(s.w)n++;p.slots.forEach((_,i)=>{if(s.sl[i]?.d)n++})});
  t+=CARDIO.length;n+=CARDIO.filter(([k])=>cardioOn(d,k)).length;t+=4;n+=Math.min(4,d.desk||0);return {t,n,pct:Math.round(n/t*100)}}
function sessProg(d,p){const s=d.s[p.id];let n=s.w?1:0;p.slots.forEach((_,i)=>{if(s.sl[i]?.d)n++});return {n,t:p.slots.length+1}}
function muscleHits(d){const h={},c={};MG.forEach(m=>{h[m.k]=new Set();c[m.k]=0});
  PLAN.forEach(p=>{const s=d.s[p.id];p.slots.forEach((_,i)=>{if(s.sl[i]?.d)exMus(slotEx(d,p.id,i)).forEach(k=>{if(h[k]){h[k].add(p.id);c[k]++}})});
    s.x.forEach(x=>exMus(x.ex).forEach(k=>{if(h[k]){h[k].add(p.id);c[k]++}}))});return {h,c}}
function muscleStatus(d){const H=muscleHits(d),st={};MG.forEach(m=>{const n=H.h[m.k].size,pd=PD[m.k]||1;st[m.k]=n/pd});return st}
function setsOf(d){const out=[];PLAN.forEach(p=>{const s=d.s[p.id];p.slots.forEach((_,i)=>{const st=s.sl[i];if(st?.reps)out.push({ex:slotEx(d,p.id,i),kg:st.kg||0,reps:st.reps})});s.x.forEach(x=>{if(x.reps)out.push({ex:x.ex,kg:x.kg||0,reps:x.reps})})});return out}
function bestBefore(ex,k){let b=null;for(const w in weeks){if(w>=k)continue;setsOf(weeks[w]).forEach(s=>{if(s.ex===ex){const v=score(s.kg,s.reps);if(!b||v>b.v)b={...s,v,w}}})}return b}
function lastBefore(ex,k){const ws=Object.keys(weeks).filter(w=>w<k).sort().reverse();for(const w of ws){const ss=setsOf(weeks[w]).filter(s=>s.ex===ex);if(ss.length)return ss.sort((a,b)=>score(b.kg,b.reps)-score(a.kg,a.reps))[0]}return null}
function suggest(ex,str){const {lo,hi}=parseSets(str);const last=lastBefore(ex,curKey);
  if(!last)return {kg:null,reps:lo,txt:`${lo}–${hi} Wdh.`,why:`Erstes Mal: Gewicht wählen, bei dem ${lo}–${hi} saubere Wdh. gehen.`};
  if(!last.kg)return {kg:0,reps:last.reps+1,txt:`BW × ${last.reps+1}`,why:`Zuletzt ${last.reps} Wdh., heute eine mehr.`};
  if(last.reps>=hi){const inc=ISO.has(ex)?1:2.5,kg=last.kg+inc;return {kg,reps:lo,up:true,txt:`${kgStr(kg)} kg × ${lo}–${hi}`,why:`Zuletzt ${setStr(last.kg,last.reps)}, oberes Ende erreicht: +${kgStr(inc)} kg.`}}
  return {kg:last.kg,reps:Math.min(hi,last.reps+1),txt:`${kgStr(last.kg)} kg × ${Math.min(hi,last.reps+1)}`,why:`Zuletzt ${setStr(last.kg,last.reps)}: gleiches Gewicht, eine Wdh. mehr.`}}
function dayStats(d){const hit={protein:0,steps:0,sleep:0},sum={protein:0,steps:0,sleep:0},n={protein:0,steps:0,sleep:0};
  for(let i=0;i<7;i++){const v=d.days[i]||{};for(const f of ["protein","steps","sleep"])if(v[f]!=null){n[f]++;sum[f]+=v[f];if(v[f]>=T[f])hit[f]++}}
  return {hit,n,avg:f=>n[f]?sum[f]/n[f]:null}}

const TITLES=["Rookie","Starter","Grinder","Athlet","Iron","Beast","V-Taper","Legende"];
function xpWeek(d,k){let x=Object.values(d.days||{}).reduce((n,v)=>n+((v&&v.qw)||[]).length*25,0);PLAN.forEach(p=>{const s=d.s[p.id];if(s.w)x+=10;p.slots.forEach((_,i)=>{if(s.sl[i]?.d)x+=30});x+=s.x.length*20;const sp=sessProg(d,p);if(sp.n===sp.t)x+=100});
  x+=CARDIO.filter(([k])=>cardioOn(d,k)).length*60+(d.desk||0)*10;const ds=dayStats(d);x+=ds.hit.protein*20+ds.hit.steps*10+ds.hit.sleep*10;
  const pct=progress(d).pct;if(pct>=100)x+=300;else if(pct>=80)x+=150;x+=prsOf(d,k).length*50;return x}
function prsOf(d,k){return setsOf(d).filter(s=>{const b=bestBefore(s.ex,k);return b&&score(s.kg,s.reps)>b.v+.01})}
const lvlAt=L=>125*L*(L-1);
function levelInfo(){let xp=0;for(const k in weeks)xp+=xpWeek(weeks[k],k);let L=1;while(xp>=lvlAt(L+1))L++;const into=xp-lvlAt(L),need=lvlAt(L+1)-lvlAt(L);
  return {xp,level:L,title:TITLES[Math.min(TITLES.length-1,L-1)],into,need,pct:Math.round(into/need*100)}}
function weekStreak(){const cur=keyOf(mondayOf(new Date()));let n=0;const m=mondayOf(new Date());const curD=weeks[cur];if(!(curD&&progress(curD).pct>=75))m.setDate(m.getDate()-7);
  for(let i=0;i<104;i++){const d=weeks[keyOf(m)];if(d&&progress(d).pct>=75){n++;m.setDate(m.getDate()-7)}else break}return n}
function allSets(){const out=[];Object.keys(weeks).sort().forEach(k=>setsOf(weeks[k]).forEach(s=>out.push({...s,k})));return out}
function badges(){const ws=Object.values(weeks),S=allSets(),prs=Object.keys(weeks).reduce((a,k)=>a+prsOf(weeks[k],k).length,0);
  const best=ex=>S.filter(s=>s.ex===ex).reduce((m,s)=>Math.max(m,s.kg),0);
  return [
   ["Erster Schritt","Erstes Workout geloggt",ws.some(d=>PLAN.some(p=>sessProg(d,p).n>0)),P.bolt],
   ["Dreifach","Alle 3 Gym-Tage in einer Woche",ws.some(d=>PLAN.every(p=>{const s=sessProg(d,p);return s.n===s.t})),P.dumb],
   ["Perfekte Woche","100 % Pflichtpunkte",ws.some(d=>progress(d).pct>=100),P.star],
   ["V-Builder","Lat und Schulter je 3 Tage",ws.some(d=>{const H=muscleHits(d);return H.h.lat.size>=3&&H.h.schulter.size>=3}),P.trend],
   ["Protein-Profi","7/7 Tage Proteinziel",ws.some(d=>dayStats(d).hit.protein>=7),P.drop],
   ["Schlafprofi","7/7 Nächte ≥ 7,5 h",ws.some(d=>dayStats(d).hit.sleep>=7),P.moon],
   ["Rekordjäger","10 Rekorde",prs>=10,P.trophy],
   ["100er Club","Bankdrücken 100 kg",best("bank")>=100,P.target],
   ["Unter 6","5 km schneller als 6:00 /km",ws.some(d=>d.run.km>=5&&d.run.min&&d.run.min/d.run.km<6),P.run],
   ["Streak 4","4 Wochen ≥ 75 % am Stück",weekStreak()>=4,P.flame]

function nextSession(){const H=muscleHits(state);let best=null;

    const gains=new Set();p.slots.forEach((_,i)=>exMus(slotEx(state,p.id,i)).forEach(k=>{if(FOCUS.has(k)&&H.h[k].size<PD[k]&&!H.h[k].has(p.id))gains.add(k)}));

async function save(){saveTimer=null;const k=dirtyKey||curKey;dirtyKey=null;const d=weeks[k];if(!d)return;

  try{await Store.put(k,data);setSync("",Store.db?"In der Cloud gespeichert":"Nur lokal gespeichert")}

function ring(pct,size=84,stroke=8,inner){const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1b1f25" stroke-width="${stroke}"/><circle class="rfill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#vf-neon)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(100,pct))/100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><span class="val">${inner??`<b>${pct}%</b>`}</span></div>`}
function miniRing(n,t){const r=8.5,c=2*Math.PI*r,p=t?n/t:0;return `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="${r}" fill="none" stroke="#1b1f25" stroke-width="3"/><circle cx="11" cy="11" r="${r}" fill="none" style="stroke:${p>=1?"var(--neon)":"#5b7cff"}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 11 11)"/></svg>`}
function spark(vals,w=96,h=28){if(vals.length<2)return "";const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-8)+4,h-4-(v-mn)/r*(h-8)]);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3"/></svg>`}
function avatar(L,size=56){const r=(size-6)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="#0e1013" stroke="#1b1f25" stroke-width="3"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#vf-neon)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-L.pct/100)}" transform="rotate(-90 ${size/2} ${size/2})"/><svg x="${size*.17}" y="${size*.17}" width="${size*.66}" height="${size*.66}" viewBox="0 0 100 100">${HELM_INNER}</svg></svg>`}

  const per={};ks.forEach(k=>setsOf(weeks[k]).forEach(s=>{(per[s.ex]??={})[k]=Math.max(per[s.ex][k]||0,score(s.kg,s.reps));(per[s.ex].__s??=[]).push(s)}));
  const exs=Object.keys(per);

  MG.forEach(m=>{const list=exs.filter(e=>exGroup(e)===m.k);if(!list.length)return;h+=`<div class="grp">${m.n}</div>`;
    list.forEach(e=>{const ss=per[e].__s,best=ss.reduce((a,b)=>score(b.kg,b.reps)>score(a.kg,a.reps)?b:a),last=ss.at(-1),series=ks.filter(k=>per[e][k]).map(k=>per[e][k]);

  h+=`</div></section>`;
  const cols=[];for(let i=7;i>=0;i--){const m=new Date(monday);m.setDate(m.getDate()-7*i);const k=keyOf(m),d=weeks[k];cols.push({k,cur:i===0,pct:d?progress(d).pct:0,w:d?.weight})}

  h+=`<section class="sec"><div class="sec-h"><h2>Ziele</h2><span>Rudern & Latzug ≥ Bankdrücken</span></div><div class="card tbl"><table><thead><tr><th>Übung</th><th>Start</th><th>März</th><th>12 Mon.</th></tr></thead><tbody>
    ${[["Bankdrücken","80×7","90×5 · 100×1","100×5"],["Schrägbank KH 30°","20×8","32,5×8","40×8"],["Latzug / Klimmzug","BW×9","80×8 · 10 Klimmz.","90×8 · +15×6"],["Rudern","testen","80×8","95×8"],["Schulterdrücken KH","24×10","30×8","34×8"],["Seitheben sauber","10×20","12×15","16×12"],["KH-Curls","16–20","22,5×8","25×8"],["Skullcrusher SZ","22×10","37,5×8","45×8"],["Kniebeuge","neu","100×8","130×5"],["Rum. Kreuzheben","neu","100×8","130×8"],["5 km Lauf","7:00 /km","5:45 /km","5:00 /km"]].map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h;

</section>`}

  try{navigator.wakeLock?.request("screen").then(w=>wakeLock=w).catch(()=>{})}catch(e){}}

function tickLive(){if(!live)return;const el=$("live-el");if(el)el.textContent=clock(Date.now()-live.start);
  if(live.rest){const left=live.rest.end-Date.now(),rt=$("rest-left"),rb=$("rbtn");
    if(left<=0){live.rest=null;persistLive();try{navigator.vibrate?.([200,100,200])}catch(e){}renderLive();return}

    <div class="fin-opt"><span class="eyebrow">Optional anhängen</span><div class="qw">${["stretch","becken","core","mobil"].map(k=>`<button class="qwc ${qd.includes(k)?"on":""}" data-act="qwOpen" data-k="${k}" data-day="${ti}"><b>${QW[k].n}</b><small>${qd.includes(k)?"erledigt":QW[k].min+" Min"}</small>${qd.includes(k)?`<i>${ic(P.check,12,3)}</i>`:""}</button>`).join("")}</div></div>

function cycleInfo(){const c=PROFILE.cycle;if(!c||!c.start)return null;const len=+c.len||28,plen=+c.plen||5,st=new Date(c.start+"T00:00:00"),now=new Date();now.setHours(0,0,0,0);

function keyMonday(k){const [y,w]=k.split("-W").map(Number),j=new Date(y,0,4),m=new Date(j);m.setDate(j.getDate()-((j.getDay()+6)%7)+(w-1)*7);m.setHours(0,0,0,0);return m}
function recovery(){const last={};Object.keys(weeks).sort().slice(-2).forEach(k=>{const d=weeks[k],m=keyMonday(k);PLAN.forEach(p=>{const s=d.s[p.id];if(!s||s.day==null)return;const dt=new Date(m);dt.setDate(m.getDate()+s.day);dt.setHours(18);
    const mus=new Set();p.slots.forEach((_,i)=>{if(s.sl[i]?.d)exMus(slotEx(d,p.id,i)).forEach(x=>mus.add(x))});s.x.forEach(x=>exMus(x.ex).forEach(y=>mus.add(y)));mus.forEach(x=>{if(!last[x]||dt>last[x])last[x]=dt})})});
  const now=Date.now(),out=[];for(const k in last){const need=(BIGM.has(k)?72:48)*3600e3,el=now-last[k];if(el<0)continue;const pct=Math.min(100,Math.round(el/need*100));if(pct<100)out.push({k,pct,left:Math.ceil((need-el)/3600e3)})}
  return out.sort((a,b)=>a.pct-b.pct)}

    case "qClose":$("qsheet").hidden=true;break;
    case "qwDone":{const di=+b.dataset.day,d=state.days[di]||(state.days[di]={}),k=b.dataset.k;d.qw=d.qw||[];if(d.qw.includes(k))d.qw=d.qw.filter(x=>x!==k);else{d.qw.push(k);toast(`${QW[k].n} erledigt · +25 XP`)}if(!d.qw.length)delete d.qw;$("qsheet").hidden=true;changed();break}
    case "hstep":{const di=+b.dataset.day,d=state.days[di]||(state.days[di]={}),k=b.dataset.k;d[k]=Math.max(0,Math.round(((d[k]||0)+(+b.dataset.n))*4)/4);if(!d[k])delete d[k];changed();break}
    case "htog":{const di=+b.dataset.day,d=state.days[di]||(state.days[di]={}),k=b.dataset.k;if(d[k])delete d[k];else d[k]=true;changed();break}
    case "gesund":ui.tab="koerper";ui.ksub="gesund";history.replaceState(null,"","#koerper");window.scrollTo(0,0);render();break;
    case "ksub":ui.ksub=b.dataset.k;render();break;
    case "setDay":if(S.day===i)delete S.day;else S.day=i;changed();break;
    case "reorder":ui.reorder=ui.reorder===sid?null:sid;render();break;
    case "mv":{const oo=ordOf(state,sid),d2=+b.dataset.d,q=i+d2;if(q<0||q>=oo.length)break;[oo[i],oo[q]]=[oo[q],oo[i]];S.order=oo;changed();break}
    case "liveJump":live.idx=parseIdx(b.dataset.i);live.draft={};live.extra=0;persistLive();renderLive();$("live").scrollTo(0,0);break;
    case "liveLater":{const id=live.idx;if(typeof id==="string"){const jx=+id.slice(1),X=state.s[live.sid].x;if(jx<X.length-1){[X[jx],X[jx+1]]=[X[jx+1],X[jx]]}}else{const oo=ordOf(state,live.sid),q=oo.indexOf(id);if(q<oo.length-1){[oo[q],oo[q+1]]=[oo[q+1],oo[q]];state.s[live.sid].order=oo;live.idx=oo[q]}else{const X=state.s[live.sid].x;if(X.length)live.idx="x0"}}
      live.draft={};live.extra=0;persistLive();changed();toast("Eine Position nach hinten");break}
    case "liveSkip":{const it=itemInfo(live.sid,live.idx);if(!it.st.d)it.st.skip=true;const its=liveItems(live.sid),q=its.indexOf(live.idx);live.idx=its[Math.min(its.length-1,q+1)];live.draft={};live.extra=0;persistLive();changed();$("live").scrollTo(0,0);break}
    case "liveAddEx":openPicker({title:"Übung hinzufügen",group:"brust",current:null,onPick:id=>{const S2=state.s[live.sid];S2.x.push({ex:id,kg:null,reps:null});live.idx="x"+(S2.x.length-1);live.draft={};live.extra=0;markActive(live.sid);persistLive()}});break;
    case "restGo":{const it=itemInfo(live.sid,live.idx),ss=liveSets(it.st),rows=liveRows(it,ss),left=[...Array(rows).keys()].some(k=>!ss[k]);live.rest=null;if(!left){const its=liveItems(live.sid),q=its.indexOf(live.idx);if(q<its.length-1){live.idx=its[q+1];live.draft={};live.extra=0}}persistLive();renderLive();$("live").scrollTo(0,0);break}
    case "lsStep":{const k=+b.dataset.n,fld=b.dataset.k,d=+b.dataset.d,inp=$(fld==="kg"?"ls-kg-"+k:"ls-rp-"+k),cur=numOr(inp?.value)??0,v=Math.max(0,Math.round((cur+d)*4)/4);
      const it=itemInfo(live.sid,live.idx);if(it.st.sets?.[k]){it.st.sets[k][fld]=fld==="reps"?Math.round(v):v;recompute(it.st);changed()}else{(live.draft[k]??={})[fld]=v;if(inp)inp.value=fld==="kg"?v:Math.round(v);persistLive()}break}
    case "lsDel":{const k=+b.dataset.n,it=itemInfo(live.sid,live.idx),ss=it.st.sets||{},ns={},nd={};Object.keys(ss).forEach(x=>{x=+x;if(x<k)ns[x]=ss[x];else if(x>k)ns[x-1]=ss[x]});Object.keys(live.draft).forEach(x=>{x=+x;if(x<k)nd[x]=live.draft[x];else if(x>k)nd[x-1]=live.draft[x]});
      it.st.sets=ns;live.draft=nd;live.extra=(live.extra||0)-1;if(!Object.keys(ns).length){it.st.d=false;it.st.kg=null;it.st.reps=null}else recompute(it.st);persistLive();changed();break}
    /* Live */
    case "liveClose":closeLive();break;
    case "liveWarm":state.s[live.sid].w=true;markActive(live.sid);live.idx=ordOf(state,live.sid)[0];persistLive();changed();break;
    case "liveNext":{const its=liveItems(live.sid),q=its.indexOf(live.idx);live.idx=its[Math.min(its.length-1,q+1)]}live.draft={};live.extra=0;persistLive();renderLive();$("live").scrollTo(0,0);break;
    case "livePrev":{const its=liveItems(live.sid),q=its.indexOf(live.idx);live.idx=q<=0?-1:its[q-1]}live.draft={};live.extra=0;persistLive();renderLive();break;
    case "liveFinish":live.fin=true;live.rest=null;markActive(live.sid);persistLive();changed();break;
    case "lsAdd":live.extra=(live.extra||0)+1;persistLive();renderLive();break;
    case "lsDone":{const k=+b.dataset.n,it=itemInfo(live.sid,live.idx),st=it.st;st.sets=st.sets||{};
      if(st.sets[k]){delete st.sets[k];if(!Object.keys(st.sets).length){st.d=false;st.kg=null;st.reps=null}else recompute(st)}
      else{const sg=suggest(it.ex,it.sets),ss=st.sets,kg=numOr($("ls-kg-"+k)?.value)??rowVal(k,"kg",ss,sg),reps=numOr($("ls-rp-"+k)?.value)??rowVal(k,"reps",ss,sg);
        if(kg==null){toast("Gewicht eintragen (0 für Körpergewicht)");$("ls-kg-"+k)?.focus();break}
        st.sets[k]={kg:kg||0,reps:Math.round(reps)};delete st.skip;delete live.draft[k];recompute(st);markActive(live.sid);
        const rows=liveRows(it,st.sets),doneN=Object.keys(st.sets).length,its=liveItems(live.sid);if(doneN<rows||its.indexOf(live.idx)<its.length-1){const dur=restFor(it.ex,it.sets);live.rest={end:Date.now()+dur,dur}}
        if(doneN>=rows)toast(`${exName(it.ex)} erledigt`)}
      persistLive();changed();break}
    case "restAdd":if(live.rest){live.rest.end+=15000;live.rest.dur+=15000}break;
    case "restSkip":live.rest=null;renderLive();break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const v=numOr(t.value),k=t.dataset.k;
  if(f==="slot"){const S=state.s[t.dataset.sid],st=S.sl[+t.dataset.i]||(S.sl[+t.dataset.i]={});st[k]=v==null?null:(k==="reps"?Math.round(v):Math.round(v*4)/4);if(st.reps){st.d=true;markActive(t.dataset.sid)}}
  else if(f==="x"){const x=state.s[t.dataset.sid].x[+t.dataset.j];x[k]=v==null?null:(k==="reps"?Math.round(v):Math.round(v*4)/4)}
  else if(f==="run"){state.run[k]=v;if(state.run.km&&state.run.min){state.run.done=true;markActive("run")}}
  else if(f==="special"){state.special=t.value.slice(0,80)}
  else if(f==="day"){const di=+t.dataset.day,d=state.days[di]||(state.days[di]={});if(v==null)delete d[k];else d[k]=k==="sleep"?Math.round(v*4)/4:Math.round(v)}
  else if(f==="weight"){state.weight=v==null?null:Math.round(v*10)/10}
  else if(f==="m"){state.m=state.m||{};if(v==null)delete state.m[t.dataset.k];else state.m[t.dataset.k]=Math.round(v*10)/10}
  else if(f==="lset"){const n=+t.dataset.n,st=itemInfo(live.sid,live.idx).st;
    if(st.sets?.[n]){st.sets[n][k]=v==null?(k==="kg"?0:st.sets[n][k]):(k==="reps"?Math.round(v):Math.round(v*4)/4);recompute(st)}
    else{(live.draft[n]??={})[k]=v;persistLive();return}}
  changed();
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.note==null)return;const N=loadNotes(),v=t.value.trim();if(v)N[t.dataset.note]=v;else delete N[t.dataset.note];try{localStorage.setItem("vfit-notes",JSON.stringify(N))}catch(e){}toast("Einstellung gespeichert")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("dsheet").hidden){$("dsheet").hidden=true;ui.dsheet=null}else if(!$("sheet").hidden)closePicker();else if(live)closeLive()}if(e.key==="Enter"&&e.target.id==="customName")document.querySelector('[data-act="addCustom"]').click()});
async function shift(d){await flush();monday.setDate(monday.getDate()+d);selectWeek();render()}
$("prev").addEventListener("click",()=>shift(-7));
$("next").addEventListener("click",()=>shift(7));
$("wk").addEventListener("click",async()=>{await flush();monday=mondayOf(new Date());selectWeek();render()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush();else if(live)tickLive()});
const VALID=["heute","training","koerper","erfolge","wissen"];
function fromHash(){const h=location.hash.slice(1);if(VALID.includes(h))ui.tab=h}
window.addEventListener("hashchange",()=>{fromHash();render()});

/* ===== Start ===== */
fromHash();selectWeek();render();
(async()=>{
  await Store.init();
  try{const raw=await Store.all();window.__rawN=Object.keys(raw).length;weeks={};for(const k in raw)weeks[k]=normalize(raw[k]);setSync("",Store.db?"In der Cloud gespeichert":"Nur lokal gespeichert")}
  catch(e){setSync("err","Laden fehlgeschlagen");toast("Daten konnten nicht geladen werden. Seite neu laden.")}
  loaded=true;selectWeek();render();
  if(!loadProfile()&&!window.__rawN)openOnboard();
  try{const L=JSON.parse(localStorage.getItem("vfit-live")||"null");if(L&&L.week===curKey&&Date.now()-L.start<4*3600e3){live={draft:{},extra:0,...L,rest:L.rest&&L.rest.end>Date.now()?L.rest:null,fin:!!L.fin};openLive()}else localStorage.removeItem("vfit-live")}catch(e){}
})();
</script>
